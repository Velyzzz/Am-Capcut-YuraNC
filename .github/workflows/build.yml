name: Build AM2CapCut Shizuku v6 Fixed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP source
        run: |
          python3 -c '
          import glob, zipfile
          zips = sorted(glob.glob("*.zip"))
          assert zips, "ERROR: Belum ada file .zip di repository!"
          with zipfile.ZipFile(zips[-1]) as zf:
              for m in zf.namelist():
                  if not m.startswith(".github/"):
                      zf.extract(m)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Show Error Summary
        if: failure()
        run: grep -B 2 -A 15 "FAILURE:" build.log || head -n 40 build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM2CapCut-Shizuku-v6-fixed-debug
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build AM2CapCut Shizuku v6 Clean APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Fix Structure
        run: |
          echo "=== Sebelum Unzip ==="
          ls -la
          
          # Ekstrak ZIP
          unzip -o AM2CapCut_Shizuku_v6_clean.zip -d extracted_dir
          
          # Jika isi ZIP terbungkus dalam 1 folder utama, pindahkan ke root
          if [ -d "extracted_dir/AM2CapCut_Shizuku_v6_clean" ]; then
            mv extracted_dir/AM2CapCut_Shizuku_v6_clean/* .
            mv extracted_dir/AM2CapCut_Shizuku_v6_clean/.[^.]* . 2>/dev/null || true
          else
            cp -r extracted_dir/* .
          fi
          
          rm -rf extracted_dir AM2CapCut_Shizuku_v6_clean
          
          echo "=== Setelah Diratakan ke Root ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM2CapCut-Shizuku-v6-clean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
